<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1390" viewBox="0 0 1800 1390" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Flowchart Fungsi Aplikasi PINISI</title>
  <desc id="description">Alur pengunjung publik, login, pengajuan karya oleh kontributor, proses verifikasi, pengelolaan admin, dan layanan Supabase.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#eaf1fa"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153a60"/>
      <stop offset="1" stop-color="#286fae"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7f5"/>
      <stop offset="1" stop-color="#d3eeea"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#dceafb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#f7eccb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163858" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6f8eae"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3679b9"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#38978c"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill:#173755; font-size:34px; font-weight:750; letter-spacing:-.6px; }
      .subtitle { fill:#688098; font-size:15px; }
      .section { fill:#56718c; font-size:12px; font-weight:750; letter-spacing:1.8px; }
      .node-title { fill:#203f5e; font-size:16px; font-weight:700; }
      .node-copy { fill:#627b93; font-size:12px; }
      .small { fill:#6c8298; font-size:11px; }
      .tag { font-size:10px; font-weight:750; letter-spacing:1px; }
      .white-title { fill:#fff; font-size:15px; font-weight:700; }
      .white-copy { fill:#d8e8f6; font-size:11px; }
      .line { fill:none; stroke:#6f8eae; stroke-width:2.2; marker-end:url(#arrow); }
      .line-blue { fill:none; stroke:#3679b9; stroke-width:2.5; marker-end:url(#arrowBlue); }
      .line-teal { fill:none; stroke:#38978c; stroke-width:2.5; marker-end:url(#arrowTeal); }
      .dash { fill:none; stroke:#92abc2; stroke-width:1.7; stroke-dasharray:6 6; }
    </style>
  </defs>

  <rect width="1800" height="1390" fill="url(#page)"/>
  <circle cx="1660" cy="82" r="175" fill="#dceafa" opacity=".42"/>
  <circle cx="95" cy="1315" r="210" fill="#d8eee9" opacity=".32"/>

  <g>
    <rect x="70" y="46" width="52" height="52" rx="16" fill="url(#navy)"/>
    <path d="M85 76h24M97 58v18M88 66l9-8 9 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="70" class="title">Flowchart Fungsi Aplikasi PINISI</text>
    <text x="142" y="96" class="subtitle">Alur akses publik, kontribusi karya, verifikasi, dan pengelolaan platform</text>
    <g transform="translate(1375 55)">
      <circle cx="8" cy="8" r="6" fill="#4288c4"/><text x="24" y="12" class="small">Publik</text>
      <circle cx="105" cy="8" r="6" fill="#45a298"/><text x="121" y="12" class="small">Kontributor</text>
      <circle cx="245" cy="8" r="6" fill="#638ac7"/><text x="261" y="12" class="small">Verifikator</text>
      <circle cx="388" cy="8" r="6" fill="#d1a844"/><text x="404" y="12" class="small">Admin</text>
    </g>
  </g>

  <text x="72" y="151" class="section">01 / JELAJAHI KARYA TANPA LOGIN</text>
  <rect x="65" y="174" width="1670" height="249" rx="24" fill="#fff" stroke="#dce7f1" filter="url(#shadow)"/>

  <g filter="url(#shadow)">
    <rect x="105" y="246" width="205" height="96" rx="17" fill="url(#blue)" stroke="#cbdff2"/>
    <circle cx="142" cy="294" r="19" fill="#d4e7f7"/>
    <circle cx="142" cy="288" r="6" fill="none" stroke="#347bb6" stroke-width="2"/>
    <path d="M131 306c2-8 20-8 22 0" fill="none" stroke="#347bb6" stroke-width="2" stroke-linecap="round"/>
    <text x="172" y="286" class="node-title">Pengunjung</text>
    <text x="172" y="307" class="node-copy">Buka situs PINISI</text>
    <text x="172" y="324" class="small">Tanpa akun</text>

    <rect x="388" y="226" width="330" height="136" rx="18" fill="#f8fbff" stroke="#d6e4f0"/>
    <text x="414" y="256" class="tag" fill="#4288c4">NAVIGASI PUBLIK</text>
    <text x="414" y="285" class="node-title">Beranda · Koleksi · Kontributor</text>
    <text x="414" y="310" class="node-copy">Cari judul, filter kategori, telusuri karya</text>
    <text x="414" y="332" class="node-copy">dan temukan profil para kontributor.</text>

    <rect x="838" y="205" width="344" height="91" rx="16" fill="url(#blue)" stroke="#cbdff2"/>
    <circle cx="873" cy="250" r="17" fill="#d2e6f8"/>
    <path d="M865 243h16v14h-16zM868 240v6M878 240v6" fill="none" stroke="#347bb6" stroke-width="1.8" stroke-linecap="round"/>
    <text x="902" y="244" class="node-title">Karya terverifikasi</text>
    <text x="902" y="265" class="node-copy">Filter, pencarian, dan daftar karya</text>

    <rect x="838" y="312" width="344" height="83" rx="16" fill="#f3faf9" stroke="#cce8e3"/>
    <circle cx="873" cy="353" r="17" fill="#d9efeb"/>
    <circle cx="869" cy="349" r="5" fill="none" stroke="#338b81" stroke-width="1.8"/>
    <path d="M860 362c2-7 16-7 18 0M880 348h8M884 344v8" fill="none" stroke="#338b81" stroke-width="1.8" stroke-linecap="round"/>
    <text x="902" y="349" class="node-title">Direktori kontributor</text>
    <text x="902" y="370" class="node-copy">Profil publik dan karya terbit</text>

    <rect x="1294" y="246" width="365" height="96" rx="17" fill="url(#navy)"/>
    <circle cx="1332" cy="294" r="19" fill="#ffffff" opacity=".14"/>
    <path d="M1324 284h16v20h-16zM1328 289h8M1328 294h8M1328 299h6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="1364" y="286" class="white-title">Detail karya / profil publik</text>
    <text x="1364" y="307" class="white-copy">Baca deskripsi, tonton video, atau buka PDF</text>
    <text x="1364" y="324" class="white-copy">serta bagikan tautan karya.</text>
  </g>

  <path d="M310 294h66" class="line-blue"/>
  <path d="M718 272h58v-21h47" class="line-blue"/>
  <path d="M718 316h58v78h47" class="line-teal"/>
  <path d="M1182 250h112" class="line-blue"/>
  <path d="M1182 353h50v18h62v-55" class="line-teal"/>
  <text x="1300" y="385" class="small">Pilih karya dari profil</text>

  <text x="72" y="473" class="section">02 / LOGIN DAN PEMBAGIAN AKSES</text>
  <g filter="url(#shadow)">
    <rect x="105" y="498" width="220" height="78" rx="16" fill="#fff" stroke="#dce7f1"/>
    <text x="215" y="530" text-anchor="middle" class="node-title">Masuk</text>
    <text x="215" y="550" text-anchor="middle" class="node-copy">Email dan kata sandi</text>

    <rect x="414" y="498" width="276" height="78" rx="16" fill="url(#blue)" stroke="#cbdff2"/>
    <text x="552" y="530" text-anchor="middle" class="node-title">Supabase Auth</text>
    <text x="552" y="550" text-anchor="middle" class="node-copy">Memvalidasi sesi akun</text>

    <rect x="780" y="498" width="292" height="78" rx="16" fill="#f8fbff" stroke="#d6e4f0"/>
    <text x="926" y="530" text-anchor="middle" class="node-title">Profil dan peran akun</text>
    <text x="926" y="550" text-anchor="middle" class="node-copy">Hak akses dibatasi berdasarkan peran</text>

    <path d="M1244 493 1312 537 1244 581 1176 537Z" fill="#fff" stroke="#cddceb" stroke-width="1.5"/>
    <text x="1244" y="533" text-anchor="middle" class="node-title">Peran</text>
    <text x="1244" y="551" text-anchor="middle" class="node-copy">pengguna?</text>
  </g>
  <path d="M325 537h80" class="line"/>
  <path d="M690 537h80" class="line"/>
  <path d="M1072 537h96" class="line"/>

  <text x="72" y="638" class="section">03 / ALUR KERJA BERDASARKAN PERAN</text>
  <rect x="65" y="660" width="535" height="578" rx="24" fill="#f4fbfa" stroke="#cde9e4"/>
  <rect x="632" y="660" width="535" height="578" rx="24" fill="#f5f8ff" stroke="#d5e1f3"/>
  <rect x="1199" y="660" width="536" height="578" rx="24" fill="#fffaf0" stroke="#eee1bd"/>

  <g>
    <rect x="92" y="682" width="42" height="28" rx="14" fill="#45a298"/>
    <text x="113" y="701" text-anchor="middle" class="tag" fill="#fff">01</text>
    <text x="148" y="702" class="node-title">KONTRIBUTOR</text>
    <text x="92" y="730" class="small">Berbagi karya dan memantau status pengajuan</text>

    <rect x="660" y="682" width="42" height="28" rx="14" fill="#638ac7"/>
    <text x="681" y="701" text-anchor="middle" class="tag" fill="#fff">02</text>
    <text x="716" y="702" class="node-title">VERIFIKATOR</text>
    <text x="660" y="730" class="small">Meninjau karya dan memberi keputusan</text>

    <rect x="1227" y="682" width="42" height="28" rx="14" fill="#d1a844"/>
    <text x="1248" y="701" text-anchor="middle" class="tag" fill="#fff">03</text>
    <text x="1283" y="702" class="node-title">ADMIN</text>
    <text x="1227" y="730" class="small">Mengelola akun, konten, dan penayangan</text>
  </g>

  <path d="M1244 581v48H330v100" class="line-teal"/>
  <path d="M1244 629h-344v100" class="line-blue"/>
  <path d="M1244 629h454v100" fill="none" stroke="#c49a3a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="756" width="473" height="76" rx="15" fill="#fff" stroke="#d6e9e5"/>
    <circle cx="129" cy="794" r="17" fill="#e0f2ef"/>
    <path d="M123 794h12M129 788v12" stroke="#338b81" stroke-width="2" stroke-linecap="round"/>
    <text x="159" y="787" class="node-title">Kelola profil profesional</text>
    <text x="159" y="808" class="node-copy">Nama, jabatan, keahlian, foto, dan kata sandi</text>

    <rect x="96" y="858" width="473" height="131" rx="15" fill="#fff" stroke="#d6e9e5"/>
    <text x="121" y="887" class="node-title">Ajukan karya</text>
    <text x="121" y="910" class="node-copy">Isi judul, deskripsi, kategori, dan thumbnail</text>
    <rect x="121" y="928" width="197" height="39" rx="10" fill="url(#teal)" stroke="#cce8e3"/>
    <text x="219" y="952" text-anchor="middle" class="small" fill="#28766e">Video → tautan YouTube</text>
    <rect x="332" y="928" width="210" height="39" rx="10" fill="#eef6f5" stroke="#d7eae7"/>
    <text x="437" y="952" text-anchor="middle" class="small" fill="#28766e">Kategori lain → unggah PDF</text>

    <rect x="96" y="1020" width="473" height="76" rx="15" fill="#e5f4f1" stroke="#b9dfd9"/>
    <circle cx="130" cy="1058" r="17" fill="#cdeae4"/>
    <path d="M130 1048v12l8 5" fill="none" stroke="#31877d" stroke-width="2" stroke-linecap="round"/>
    <text x="160" y="1052" class="node-title">Status: Menunggu verifikasi</text>
    <text x="160" y="1073" class="node-copy">Pantau status dan umpan balik di Profil</text>
  </g>
  <path d="M330 832v20" class="line-teal"/>
  <path d="M330 989v25" class="line-teal"/>
  <text x="94" y="1130" class="small">Jika diminta revisi, kontributor melihat alasan</text>
  <text x="94" y="1147" class="small">dan dapat memperbarui pengajuan yang menunggu.</text>

  <g filter="url(#shadow)">
    <rect x="663" y="756" width="473" height="78" rx="15" fill="#fff" stroke="#d7e2f1"/>
    <circle cx="697" cy="795" r="17" fill="#e4edfa"/>
    <path d="M689 795h16M693 790l-4 5 4 5M701 790l4 5-4 5" fill="none" stroke="#557db8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="727" y="787" class="node-title">Antrean seluruh postingan</text>
    <text x="727" y="809" class="node-copy">Cari, filter status, dan periksa materi kontributor</text>

    <rect x="663" y="862" width="473" height="93" rx="15" fill="#fff" stroke="#d7e2f1"/>
    <text x="900" y="895" text-anchor="middle" class="node-title">Tinjau isi, tautan video, atau PDF</text>
    <text x="900" y="919" text-anchor="middle" class="node-copy">Gunakan tindakan sesuai status pengajuan</text>

    <rect x="663" y="982" width="228" height="94" rx="15" fill="#e9f6f2" stroke="#c2e6dc"/>
    <circle cx="696" cy="1015" r="14" fill="#d1eee5"/>
    <path d="m689 1015 5 5 9-11" fill="none" stroke="#368b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="719" y="1018" class="node-title" fill="#2d7665">Setujui</text>
    <text x="684" y="1047" class="small">Menjadi karya terverifikasi</text>

    <rect x="908" y="982" width="228" height="94" rx="15" fill="#fff5e9" stroke="#f0dfc4"/>
    <circle cx="941" cy="1015" r="14" fill="#faead4"/>
    <path d="M941 1007v9M941 1020v1" stroke="#bd8741" stroke-width="2" stroke-linecap="round"/>
    <text x="964" y="1018" class="node-title" fill="#956c35">Minta revisi</text>
    <text x="929" y="1047" class="small">Alasan dikirim ke kontributor</text>

    <rect x="663" y="1100" width="473" height="64" rx="14" fill="#f4f6fb" stroke="#dce3ee"/>
    <text x="900" y="1127" text-anchor="middle" class="node-title" font-size="14">Hapus postingan</text>
    <text x="900" y="1148" text-anchor="middle" class="small">Tersedia untuk postingan pada semua status</text>
  </g>
  <path d="M900 834v22" class="line-blue"/>
  <path d="M900 955v18" class="line-blue"/>
  <path d="M780 968v10" class="line-teal"/>
  <path d="M1022 968v10" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1230" y="756" width="474" height="106" rx="15" fill="#fff" stroke="#eee1bd"/>
    <circle cx="1265" cy="794" r="17" fill="#f8efd5"/>
    <path d="M1258 789h14v12h-14zM1261 785h8M1261 795h8" fill="none" stroke="#b88d32" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1295" y="788" class="node-title">Kelola akun tim</text>
    <text x="1295" y="810" class="node-copy">Buat, cari, ubah peran/profil, atau hapus akun</text>
    <text x="1295" y="833" class="small">Admin saja · kontributor dan verifikator</text>

    <rect x="1230" y="888" width="474" height="119" rx="15" fill="#fff" stroke="#eee1bd"/>
    <text x="1255" y="919" class="node-title">Kelola postingan</text>
    <text x="1255" y="943" class="node-copy">Edit karya yang disetujui · atur penayangan</text>
    <text x="1255" y="966" class="node-copy">Terbitkan / tarik dari penayangan · hapus karya</text>
    <text x="1255" y="988" class="small">Lihat semua status, cari, dan filter postingan</text>

    <rect x="1230" y="1033" width="474" height="86" rx="15" fill="url(#gold)" stroke="#ebdba9"/>
    <circle cx="1265" cy="1076" r="17" fill="#f5e9c4"/>
    <path d="M1257 1077h16M1265 1069v16M1260 1072l10 10M1270 1072l-10 10" stroke="#ad842e" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1295" y="1070" class="node-title">Kontrol admin</text>
    <text x="1295" y="1092" class="node-copy">Mengelola perubahan dan publikasi karya</text>
  </g>
  <path d="M1467 862v20" fill="none" stroke="#c49a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1467 1007v20" fill="none" stroke="#c49a3a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <path d="M569 1058h47v-263h39" fill="none" stroke="#38978c" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="581" y="901" width="105" height="26" rx="13" fill="#f4fbfa" stroke="#cde9e4"/>
  <text x="633" y="918" text-anchor="middle" class="tag" fill="#338b81">DIKIRIM</text>

  <path d="M663 1028H617v-9H569" fill="none" stroke="#d19a53" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="564" y="984" width="103" height="25" rx="12" fill="#fffaf0" stroke="#eee1bd"/>
  <text x="615" y="1001" text-anchor="middle" class="tag" fill="#a77b3b">UMPAN BALIK</text>

  <path d="M891 1029h52v-42h287v46" fill="none" stroke="#638ac7" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
  <text x="1062" y="975" text-anchor="middle" class="small">Karya disetujui</text>

  <g>
    <rect x="70" y="1270" width="1665" height="82" rx="20" fill="url(#navy)"/>
    <text x="101" y="1304" class="tag" fill="#a9d2f4">LAYANAN PENDUKUNG</text>
    <text x="101" y="1328" class="white-title">Supabase</text>
    <path d="M330 1288v47" stroke="#ffffff" opacity=".22"/>
    <circle cx="385" cy="1311" r="16" fill="#fff" opacity=".13"/>
    <text x="414" y="1307" class="white-title">Auth</text>
    <text x="414" y="1326" class="white-copy">sesi pengguna</text>
    <circle cx="658" cy="1311" r="16" fill="#fff" opacity=".13"/>
    <text x="687" y="1307" class="white-title">Database + RLS</text>
    <text x="687" y="1326" class="white-copy">profil, karya, status, peran</text>
    <circle cx="1018" cy="1311" r="16" fill="#fff" opacity=".13"/>
    <text x="1047" y="1307" class="white-title">Storage</text>
    <text x="1047" y="1326" class="white-copy">PDF, thumbnail, foto profil</text>
    <circle cx="1362" cy="1311" r="16" fill="#fff" opacity=".13"/>
    <text x="1391" y="1307" class="white-title">API server</text>
    <text x="1391" y="1326" class="white-copy">akun admin, hapus karya, akses berkas</text>
  </g>
  <path d="M330 1164v82" class="dash"/>
  <path d="M900 1164v82" class="dash"/>
  <path d="M1467 1119v127" class="dash"/>
</svg>
